name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest -q -m "integration and not paid and not network"

